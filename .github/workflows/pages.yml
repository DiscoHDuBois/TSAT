# Rigenera il render 3D e lo pubblica su GitHub Pages.
# Parte a ogni push su main, ogni 6 ore (come la cache del TLE) e a mano dalla tab Actions.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installa le dipendenze Python
        run: pip install -r requirements.txt

      - name: Calcola la timeline (orbit3d.txt)
        run: python3 astro.py --no-plot

      - name: Compila render3d e genera l'HTML
        run: make render3d && ./render3d

      - name: Prepara il sito
        run: |
          mkdir _site
          cp render3d.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
